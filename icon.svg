<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="dieP1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="dieP2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with subtle grid pattern -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Subtle Board Grid Lines -->
  <path d="M 96 160 L 416 160 M 96 256 L 416 256 M 96 352 L 416 352 M 160 96 L 160 416 M 256 96 L 256 416 M 352 96 L 352 416" stroke="#334155" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6,6" />

  <!-- Outer Neon Border -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.7" />

  <!-- P2 Red Die (Top-Right Back) -->
  <g transform="translate(290, 100) rotate(15, 80, 80)" filter="url(#shadow)">
    <rect width="140" height="140" rx="28" fill="url(#dieP2Grad)" stroke="#fecaca" stroke-width="4"/>
    <!-- Die Face: 5 pips -->
    <circle cx="40" cy="40" r="10" fill="#ffffff" />
    <circle cx="100" cy="40" r="10" fill="#ffffff" />
    <circle cx="70" cy="70" r="10" fill="#ffffff" />
    <circle cx="40" cy="100" r="10" fill="#ffffff" />
    <circle cx="100" cy="100" r="10" fill="#ffffff" />
  </g>

  <!-- Motion Trail Arc -->
  <path d="M 170 330 Q 230 190 310 210" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12,8" filter="url(#glow)"/>

  <!-- P1 Blue Die (Hero Foreground) -->
  <g transform="translate(85, 230) rotate(-10, 95, 95)" filter="url(#shadow)">
    <rect width="170" height="170" rx="36" fill="url(#dieP1Grad)" stroke="#e0f2fe" stroke-width="6" filter="url(#glow)"/>
    <!-- Die Face: 6 pips (Golden / Crisp White) -->
    <circle cx="48" cy="45" r="13" fill="#ffffff" />
    <circle cx="48" cy="85" r="13" fill="#ffffff" />
    <circle cx="48" cy="125" r="13" fill="#ffffff" />
    <circle cx="122" cy="45" r="13" fill="#ffffff" />
    <circle cx="122" cy="85" r="13" fill="#ffffff" />
    <circle cx="122" cy="125" r="13" fill="#ffffff" />
  </g>

  <!-- Title Text Banner at Bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#f8fafc" letter-spacing="8" filter="url(#glow)">DITTATE</text>
</svg>
